
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Corridas da Comunidade{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header class="site-header">
        <div class="container py-3 d-flex flex-wrap justify-content-between align-items-center gap-3">

            <a href="{{ url_for('main.index') }}" class="brand">
                Corridas da Comunidade
            </a>

            <div
                class="accessibility-controls"
                role="group"
                aria-label="Controles de tamanho do texto"
            >
                <span class="accessibility-label">
                    Tamanho do texto:
                </span>

                <button
                    type="button"
                    class="accessibility-button"
                    id="diminuir-fonte"
                    aria-label="Diminuir tamanho do texto"
                    title="Diminuir fonte"
                >
                    A−
                </button>

                <button
                    type="button"
                    class="accessibility-button"
                    id="fonte-padrao"
                    aria-label="Restaurar tamanho original do texto"
                    title="Tamanho padrão"
                >
                    A
                </button>

                <button
                    type="button"
                    class="accessibility-button"
                    id="aumentar-fonte"
                    aria-label="Aumentar tamanho do texto"
                    title="Aumentar fonte"
                >
                    A+
                </button>
            </div>

        </div>
    </header>

    <main class="container py-5" id="conteudo-principal">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container py-3">
            <p class="mb-0">
                Gestão de Inscrições em Corridas de Rua
            </p>
        </div>
    </footer>

    <div
        id="aviso-acessibilidade"
        class="visually-hidden"
        role="status"
        aria-live="polite"
    ></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const botaoDiminuir = document.getElementById("diminuir-fonte");
            const botaoPadrao = document.getElementById("fonte-padrao");
            const botaoAumentar = document.getElementById("aumentar-fonte");
            const aviso = document.getElementById("aviso-acessibilidade");

            const tamanhos = [100, 125, 150];
            let indiceAtual = 0;

            function atualizarFonte() {
                const tamanho = tamanhos[indiceAtual];

                document.documentElement.style.fontSize = tamanho + "%";

                aviso.textContent =
                    "Tamanho do texto atualizado para " + tamanho + "%.";
            }

            botaoDiminuir.addEventListener("click", function () {
                if (indiceAtual > 0) {
                    indiceAtual--;
                    atualizarFonte();
                }
            });

            botaoPadrao.addEventListener("click", function () {
                indiceAtual = 0;
                atualizarFonte();
            });

            botaoAumentar.addEventListener("click", function () {
                if (indiceAtual < tamanhos.length - 1) {
                    indiceAtual++;
                    atualizarFonte();
                }
            });

            atualizarFonte();
        });
    </script>

</body>
</html>
